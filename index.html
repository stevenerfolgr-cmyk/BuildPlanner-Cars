<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuildPlanner Cars</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080b10;color:#fff}
header{padding:16px 22px;background:#090d13;border-bottom:1px solid #29313b;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:21px;font-weight:800}.logo span{color:#65d8ff}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
.hero{text-align:center;padding:38px 5px}.hero h1{font-size:clamp(40px,7vw,70px);margin:0}.hero h1 span{color:#65d8ff}
.hero p{color:#adb7c3;font-size:17px;line-height:1.5}
.card{background:#10151c;border:1px solid #2c343e;border-radius:18px;padding:22px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
label{display:block;color:#adb7c3;font-size:14px;font-weight:bold;margin-bottom:8px}
input,select,textarea{width:100%;background:#0a0f15;color:#fff;border:1px solid #3a434e;border-radius:11px;padding:14px;font-size:16px;outline:0}
textarea{min-height:130px;resize:vertical}
.upload{display:block;margin-top:16px;padding:30px;text-align:center;border:2px dashed #3a434e;border-radius:15px;background:#0d1219;cursor:pointer}
.upload strong{display:block;font-size:18px;margin-bottom:7px}.upload small{color:#9ca7b4}
#photoInput{display:none}.preview{display:none;width:100%;max-height:380px;object-fit:contain;margin-top:15px;border-radius:14px}
.budgettop{display:flex;justify-content:space-between;align-items:center;gap:15px}
.budgetvalue{font-size:25px;font-weight:800;color:#65d8ff}
.budgetrow{display:flex;gap:10px;margin-top:12px}.budgetrow input{flex:1}
.small{background:#151b23;color:#fff;border:1px solid #39424d;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.quicktitle{color:#adb7c3;font-size:14px;font-weight:bold;margin:18px 0 9px}
.quicklist{display:flex;flex-wrap:wrap;gap:8px}.quick{border-radius:999px;padding:9px 13px;background:#151b23;color:#fff;border:1px solid #39424d;font-weight:700;cursor:pointer}
.quick.active,.quick:hover,.small:hover{border-color:#65d8ff;color:#65d8ff}
.range{width:100%;margin-top:18px;accent-color:#65d8ff}
.rangecaption{display:flex;justify-content:space-between;color:#7f8995;font-size:12px;margin-top:5px}
.build{width:100%;margin-top:22px;padding:17px;border:0;border-radius:13px;background:#65d8ff;color:#071017;font-size:18px;font-weight:900;cursor:pointer}
.status{color:#65d8ff;font-weight:bold;margin-top:12px}
.result{display:none}.summary{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.box{background:#0a0f15;border:1px solid #303844;border-radius:12px;padding:16px}.box span{display:block;color:#929dab;font-size:13px;margin-bottom:5px}
.products{margin-top:22px}.product{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #292f38}
.product small{display:block;color:#929dab;margin-top:4px}.price{color:#65d8ff;font-weight:900}
.total{display:flex;justify-content:space-between;margin-top:18px;padding-top:18px;border-top:1px solid #39414c;font-size:22px;font-weight:900}
.note{color:#929dab;font-size:13px;line-height:1.5;margin-top:14px}
.idea-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}
.idea{background:#0a0f15;border:1px solid #303844;border-radius:13px;padding:16px}
.idea .icon{font-size:27px}.idea h3{margin:9px 0 6px;font-size:16px}.idea p{margin:0;color:#9da7b3;font-size:13px;line-height:1.45}
@media(max-width:750px){.grid,.summary,.idea-grid{grid-template-columns:1fr}main{padding:15px 12px 45px}.card{padding:17px}}
</style>
</head>
<body>
<header><div class="logo">BuildPlanner <span>Cars</span></div></header>

<main>

</main>



<script>
(function(){
  window.BP_purchaseUrl = function(item){
    if(item && item.purchaseUrl) return item.purchaseUrl;
    return "https://dm-autoteile.de/";
  };
  window.BP_purchaseButton = function(item){
    const url = window.BP_purchaseUrl(item);
    return '<a class="buy-btn" href="'+url+'" target="_blank" rel="noopener noreferrer">🛒 Teil kaufen</a>';
  };
})();
</script>
<style>
.buy-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:9px 13px;border-radius:10px;background:#ff7a00;color:#fff;text-decoration:none;font-weight:800;font-size:13px}
.buy-btn:hover{filter:brightness(1.08)}
</style>


<script>
(function(){
  function addBuyButtons(){
    document.querySelectorAll('[data-purchase-item]').forEach(el=>{
      if(el.dataset.done) return;
      const card=el.closest('article,.product-card,.card,.build-item,.result-card,li,div');
      if(!card) return;
      const raw=card.innerText||"";
      const key=Object.keys(window.__BP_LINKS||{}).find(k=>raw.includes(k));
      if(key){
        const a=document.createElement('a');
        a.className='buy-btn'; a.target='_blank'; a.rel='noopener noreferrer';
        a.href=window.__BP_LINKS[key]; a.textContent='🛒 Teil kaufen';
        el.replaceWith(a); el.dataset.done='1';
      }
    });
  }
  window.__BP_LINKS = {'Frontlippe – aggressiver Look': 'https://dm-autoteile.de/tuningteile/frontspoiler', 'Große Frontlippe / Splitter': 'https://dm-autoteile.de/tuningteile/frontspoiler', 'Komplettes Bodykit': 'https://dm-autoteile.de/Bodykits', 'Widebody-Kit': 'https://dm-autoteile.de/Bodykits', 'Seitenschweller': 'https://dm-autoteile.de/Bodykits', 'Heckansatz / Heckdiffusor': 'https://dm-autoteile.de/Bodykits', 'Aggressiver Heckdiffusor': 'https://dm-autoteile.de/Bodykits', 'Heckspoiler / Dachspoiler': 'https://dm-autoteile.de/Sets', 'Großer GT-Heckflügel': 'https://dm-autoteile.de/Sets', 'Kühlergrill – Black Style': 'https://dm-autoteile.de/', 'Sportgrill / Wabengitter': 'https://dm-autoteile.de/', 'Schwarze Embleme': 'https://dm-autoteile.de/', 'Carbon-Spiegelkappen': 'https://dm-autoteile.de/', 'Carbon-Motorhaube': 'https://dm-autoteile.de/Bodykits', 'Carbon-Diffusor': 'https://dm-autoteile.de/Bodykits', 'Scheinwerfer-Upgrade / Dark Look': 'https://dm-autoteile.de/', 'LED-Seitenblinker': 'https://dm-autoteile.de/', 'Scheibentönung': 'https://dm-autoteile.de/', 'Fahrzeugfolierung': 'https://dm-autoteile.de/', 'Premium-Folierung': 'https://dm-autoteile.de/', 'Sportfedern / Tieferlegung': 'https://dm-autoteile.de/', 'Gewindefahrwerk': 'https://dm-autoteile.de/', 'Sportfahrwerk': 'https://dm-autoteile.de/', 'Luftfahrwerk': 'https://dm-autoteile.de/', 'Spurverbreiterungen': 'https://dm-autoteile.de/', 'Felgen-Set 17 Zoll': 'https://dm-autoteile.de/', 'Felgen-Set 18 Zoll': 'https://dm-autoteile.de/', 'Felgen-Set 19 Zoll': 'https://dm-autoteile.de/', 'Felgen-Set 20 Zoll': 'https://dm-autoteile.de/', 'Premium-Felgen-Set': 'https://dm-autoteile.de/', 'Sportauspuff / Endschalldämpfer': 'https://dm-autoteile.de/', 'Klappenabgasanlage': 'https://dm-autoteile.de/', 'Sportluftfilter': 'https://dm-autoteile.de/', 'Ansaugung': 'https://dm-autoteile.de/', 'Chiptuning / Software': 'https://dm-autoteile.de/', 'Ladeluftkühler': 'https://dm-autoteile.de/', 'Downpipe': 'https://dm-autoteile.de/', 'Sportbremsanlage': 'https://dm-autoteile.de/', 'Bremsscheiben + Beläge': 'https://dm-autoteile.de/', 'Sportsitze': 'https://dm-autoteile.de/', 'Lenkrad-Sportumbau': 'https://dm-autoteile.de/', 'Audio-Upgrade': 'https://dm-autoteile.de/', 'Premium-Soundsystem': 'https://dm-autoteile.de/', 'Innenraum-Upgrade': 'https://dm-autoteile.de/', 'Keramikversiegelung': 'https://dm-autoteile.de/', 'Komplett-Aufbereitung': 'https://dm-autoteile.de/'};
  const obs=new MutationObserver(addBuyButtons);
  obs.observe(document.documentElement,{childList:true,subtree:true});
  setTimeout(addBuyButtons,500);
})();
</script>

</body>
</html>
